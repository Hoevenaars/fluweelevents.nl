<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Fluweel · Je offerte</title>
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ivoor:#FAF5EF; --vlak:#F3EAE0; --inkt:#2A1322; --aubergine:#5B2A4E;
      --fuchsia:#C81E63; --champagne:#B8975A; --mauve:#7A5E6E; --lijn:#E3D5C9;
      --serif:'Newsreader',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      font-family:var(--sans); background:var(--ivoor); color:var(--inkt);
      min-height:100svh; padding:2.4rem 1.2rem 3rem; line-height:1.65;
    }
    .wrap {
      max-width:620px; margin:0 auto; background:#fff;
      border:1px solid var(--lijn); box-shadow:0 18px 48px -28px rgba(42,19,34,.22);
    }
    .balk { height:8px; background:var(--aubergine); }
    .binnen { padding:2rem 1.8rem 2.2rem; }
    .merk { font-family:var(--serif); font-weight:500; font-size:1.7rem; }
    .merk em { color:var(--fuchsia); font-style:normal; }
    .label {
      font-size:.78rem; letter-spacing:.17em; text-transform:uppercase;
      color:var(--fuchsia); font-weight:500; margin:1.1rem 0 .45rem;
    }
    h1 { font-family:var(--serif); font-weight:500; font-size:2rem; margin-bottom:.35rem; }
    .sub { color:var(--mauve); margin-bottom:1.4rem; }
    .citaat {
      font-family:var(--serif); font-style:italic; color:var(--aubergine);
      border-left:3px solid var(--fuchsia); padding-left:1rem; margin:0 0 1.5rem; max-width:42ch;
    }
    table { width:100%; border-collapse:collapse; margin:1rem 0; font-size:.95rem; }
    th { text-align:left; font-size:.72rem; letter-spacing:.08em; text-transform:uppercase; color:var(--mauve); font-weight:500; }
    td,th { padding:.55rem 0; border-bottom:1px solid var(--lijn); }
    td:nth-child(2), td:nth-child(3), th:nth-child(2), th:nth-child(3) { text-align:right; }
    .totaal { font-family:var(--serif); font-size:1.55rem; color:var(--fuchsia); margin:1.1rem 0 1.4rem; }
    .btn {
      font:inherit; padding:.75rem 1.25rem; border-radius:4px; border:0; cursor:pointer; margin-right:.45rem;
    }
    .primair { background:var(--fuchsia); color:#fff; }
    .sec { background:#fff; border:1px solid var(--lijn); color:var(--inkt); }
    .foot { margin-top:2rem; padding-top:1.1rem; border-top:1px solid var(--lijn); color:var(--mauve); font-size:.88rem; }
    .foot strong { font-family:var(--serif); font-weight:500; color:var(--inkt); font-size:1.05rem; }
  </style>
</head>
<body>
  <div class="wrap" id="app">
    <div class="balk"></div>
    <div class="binnen">
      <p class="merk">Fluweel<em>.</em></p>
      <p class="label">Offerte</p>
      <div id="content">Laden...</div>
    </div>
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    const token = params.get("token");
    const euro = (n) => {
      const value = Number(n || 0);
      const [intRaw, fracRaw] = Math.abs(value).toFixed(2).split(".");
      const intPart = intRaw.replace(/\B(?=(\d{3})+(?!\d))/g, ".");
      return "€ " + (value < 0 ? "-" : "") + intPart + "," + fracRaw;
    };
    const fmtDate = (iso) => {
      if (!iso) return "";
      const raw = String(iso).trim();
      const dateOnly = /^(\d{4})-(\d{2})-(\d{2})$/.exec(raw);
      const date = dateOnly
        ? new Date(Number(dateOnly[1]), Number(dateOnly[2]) - 1, Number(dateOnly[3]))
        : new Date(raw);
      if (Number.isNaN(date.getTime())) return raw;
      return new Intl.DateTimeFormat("nl-NL", { day: "numeric", month: "long", year: "numeric" }).format(date);
    };
    const statusLabel = { concept: "Concept", verstuurd: "Verstuurd", geaccepteerd: "Akkoord", afgewezen: "Afgewezen" };
    if (!token) document.getElementById("content").innerHTML = "<p>Geen geldige link. Neem contact op met Fluweel.</p>";
    else fetch("/api/portal/quote?token=" + encodeURIComponent(token)).then((r) => r.json()).then((d) => {
      if (!d.ok) { document.getElementById("content").innerHTML = "<p>Offerte niet gevonden.</p>"; return; }
      const q = d.quote;
      const status = statusLabel[q.status] || q.status;
      document.getElementById("content").innerHTML = `
        <h1>${q.nummer}</h1>
        <p class="sub">${q.klantNaam || ""} · ${status}</p>
        <p class="citaat">Geen copy-paste. Wel een voorstel voor een avond die blijft hangen.</p>
        <table>
          <thead><tr><th>Omschrijving</th><th>Aantal</th><th>Totaal</th></tr></thead>
          <tbody>${(q.regels || []).map((r) => `<tr><td>${r.omschrijving}</td><td>${r.aantal}</td><td>${euro(r.aantal * r.prijs)}</td></tr>`).join("")}</tbody>
        </table>
        <p class="totaal">Totaal ${euro(q.totaal)}</p>
        ${q.geldigTot ? `<p class="sub">Geldig tot ${fmtDate(q.geldigTot)}</p>` : ""}
        ${q.status === "verstuurd" ? `<button class="btn primair" id="ok">Akkoord</button><button class="btn sec" id="no">Afwijzen</button>` : ""}
        ${q.status === "geaccepteerd" ? `<p class="sub">Je hebt akkoord gegeven. We nemen het verder op.</p>` : ""}
        ${q.status === "afgewezen" ? `<p class="sub">Deze offerte is afgewezen.</p>` : ""}
        <div class="foot">
          <p class="citaat" style="border:0;padding:0;margin:0 0 .4rem">Meer dan een evenement. Een herinnering.</p>
          <p><strong>Fluweel.</strong></p>
          <p><a href="mailto:contact@fluweelevents.nl" style="color:inherit">contact@fluweelevents.nl</a></p>
        </div>
      `;
      document.getElementById("ok")?.addEventListener("click", () => act("accepteer"));
      document.getElementById("no")?.addEventListener("click", () => act("afwijzen"));
      function act(actie) {
        fetch("/api/portal/quote", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ token, actie }) })
          .then(() => location.reload());
      }
    });
  </script>
</body>
</html>
