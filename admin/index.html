<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Fluweel · Werkomgeving</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/admin.css" />
</head>
<body>
  <section id="login-view" class="login-view" hidden>
    <div class="login-kaart">
      <p class="merk">Fluweel<em>.</em></p>
      <p class="login-sub">Log in op je werkomgeving</p>
      <form id="loginform">
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
        <label for="password">Wachtwoord</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <button type="submit">Inloggen</button>
        <p class="melding" id="login-melding"></p>
      </form>
    </div>
  </section>

  <section id="app-view" class="app" hidden>
    <aside class="sidebar">
      <p class="merk">Fluweel<em>.</em></p>
      <nav id="nav"></nav>
      <div class="sidebar-foot">
        <span id="account" class="account"></span>
        <button type="button" class="knop-licht" id="uitloggen">Uitloggen</button>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </section>

  <aside id="detail" class="detail" aria-hidden="true">
    <div class="detail-backdrop" id="detail-sluit"></div>
    <div class="detail-paneel" id="detail-paneel"></div>
  </aside>

  <script src="/admin/app.js" type="module"></script>
</body>
</html>
