<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="color-scheme" content="light" />
  <title>Inloggen · Fluweel Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:wght@400;500;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ivoor:#FAF5EF; --inkt:#2A1322; --aubergine:#5B2A4E;
      --fuchsia:#C81E63; --mauve:#7A5E6E; --lijn:#E3D5C9;
      --serif:'Newsreader',Georgia,serif; --sans:'Inter',system-ui,sans-serif;
    }
    *,*::before,*::after { box-sizing:border-box; margin:0; padding:0; }
    body {
      min-height:100svh; display:flex; align-items:center; justify-content:center;
      background:var(--ivoor); color:var(--inkt); font-family:var(--sans);
      padding:2rem 1.2rem;
    }
    .kaart {
      width:100%; max-width:420px; background:#fff; border:1px solid var(--lijn);
      border-radius:4px; padding:2.2rem 2rem;
      box-shadow:0 24px 60px -40px rgba(42,19,34,.35);
    }
    .merk {
      font-family:var(--serif); font-weight:500; font-size:1.5rem;
      margin-bottom:.35rem;
    }
    .merk em { color:var(--fuchsia); font-style:normal; }
    .sub { color:var(--mauve); font-size:.95rem; margin-bottom:1.8rem; }
    form { display:flex; flex-direction:column; gap:1rem; }
    label { font-size:.85rem; color:var(--mauve); }
    input {
      font:inherit; color:var(--inkt); background:var(--ivoor);
      border:1px solid var(--lijn); border-radius:4px; padding:.8rem 1rem;
      outline:none; transition:border-color .25s, box-shadow .25s;
    }
    input:focus {
      border-color:var(--fuchsia);
      box-shadow:0 0 0 3px rgba(200,30,99,.12);
    }
    button {
      margin-top:.4rem; font:inherit; font-weight:500; color:#fff;
      background:var(--fuchsia); border:0; border-radius:4px;
      padding:.9rem 1rem; cursor:pointer; transition:background .25s;
    }
    button:hover { background:var(--aubergine); }
    button:disabled { opacity:.65; cursor:wait; }
    .melding { min-height:1.2rem; font-size:.9rem; color:var(--fuchsia); }
  </style>
</head>
<body>
  <div class="kaart">
    <p class="merk">Fluweel<em>.</em></p>
    <p class="sub">Log in om contactformulieren te bekijken.</p>
    <form id="loginform">
      <div>
        <label for="email">E-mail</label>
        <input id="email" name="email" type="email" autocomplete="username" required>
      </div>
      <div>
        <label for="password">Wachtwoord</label>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <button type="submit">Inloggen</button>
      <p class="melding" id="melding" role="status"></p>
    </form>
  </div>
  <script>
    async function checkSession() {
      const res = await fetch('/api/auth/me');
      if (res.ok) location.replace('/admin/');
    }
    checkSession();

    document.getElementById('loginform').addEventListener('submit', async (e) => {
      e.preventDefault();
      const melding = document.getElementById('melding');
      const knop = e.target.querySelector('button');
      const data = Object.fromEntries(new FormData(e.target).entries());
      knop.disabled = true;
      melding.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const json = await res.json();
        if (json.ok) {
          location.replace('/admin/');
          return;
        }
        melding.textContent = json.error || 'Inloggen is niet gelukt.';
      } catch {
        melding.textContent = 'Inloggen is niet gelukt. Probeer het opnieuw.';
      } finally {
        knop.disabled = false;
      }
    });
  </script>
</body>
</html>
